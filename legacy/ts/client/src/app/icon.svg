<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>LUME</title>
  <!--
    The eclipse mark, reduced to one colour on a transparent ground.

    The brand mark reads by luminance — a dark disc inside a bright corona — and
    that needs three tones. One ink on transparency gives two, so the ink becomes
    the corona and the occluded disc becomes the hole. On the dark app tile this
    lands exactly right: dark centre, bright ring. A soft glow was not an option;
    it turns to mush at 16px, which is the size that actually matters in a tab.

    `currentColor` with a black default: black as asked, and the media query flips
    it to white so the mark does not vanish into a dark tab strip. SVG favicons
    honour prefers-color-scheme in Chrome and Firefox; anything that ignores it
    gets the black default.
  -->
  <style>
    :root { color: #0b0b0b; }
    @media (prefers-color-scheme: dark) { :root { color: #f7f7f7; } }
  </style>
  <circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="9" />
</svg>
