services:
  - type: web
    name: lume-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: HOST
        value: "0.0.0.0"
      - key: TRUST_PROXY
        value: "1"
      - key: WS_TRUST_PROXY
        value: "1"
      - key: WS_JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      # Web Push. Optional: without these the server answers /push/vapid-key with
      # 503 "not configured" and push is simply off — which is a working state,
      # not a fault. They are declared here so the deployment shows what is
      # missing rather than leaving it to be discovered from a console error.
      #
      # Generate a pair with `npx web-push generate-vapid-keys` and set them in
      # the Render dashboard. `sync: false` keeps the values out of this file —
      # the private key is a secret and does not belong in the repository.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # NOTE: the free plan has an ephemeral filesystem (no persistent disk), so
      # this SQLite DB is reset on every deploy/restart. Acceptable by design —
      # LUME is client-authoritative: clients transparently re-bind their identity
      # and re-upload prekeys on next unlock (see docs/PROTOCOL.md). Trade-off:
      # undelivered (pending) messages and uploaded files do not survive a
      # redeploy. For durable server state, switch to a paid plan with a `disk:`
      # mount (or managed storage). SEC-20260621-015.
      - key: DB_PATH
        value: /app/data/messenger.db
