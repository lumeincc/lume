name: Release

# Tag-driven, not push-driven. A release should be a thing someone decided to
# make, and a tag is that decision written down; building one on every push to
# main produces a pile of artefacts nobody chose and nobody can tell apart.
#
#   git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags: ["v*"]
  # Manual runs produce an unsigned build for testing the workflow itself
  # without spending a version number on it.
  workflow_dispatch:

permissions:
  contents: write # required to create the release and upload to it

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      # The same gate that guards every push. A release must not be the one
      # build that skipped the tests.
      - name: Verify
        run: npm run verify

      # `expo prebuild` printed "Failed to create the native directory" and
      # still exited 0, so the first tagged release marched on and died two
      # steps later on `cd android` with a message about a missing folder. The
      # check makes the failure land where it happened.
      # A tagged release must be installable. An unsigned APK is not "a less
      # trusted build" — Android's installer rejects it outright, which is why
      # every release published so far has been undownloadable in practice.
      # Fail here, before anything is built and before a release page exists.
      - name: Signing key must be present for a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set, so this release cannot be signed"
            echo "::error::and the APK would not install. See RELEASING.md."
            exit 1
          fi

      - name: Restore the keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${RUNNER_TEMP}/lume-release.jks"
          # Never printed, never committed; the runner is destroyed with it.
          test -s "${RUNNER_TEMP}/lume-release.jks"

      # The signing config is injected here, not at build time: `android/` is
      # regenerated by prebuild on every run, so there is nowhere to commit one.
      # The `with-release-signing` plugin looks for LUME_ANDROID_KEYSTORE in the
      # environment *during prebuild* and rewrites the generated build.gradle —
      # which is why the keystore has to be restored before this step and not
      # after it.
      - name: Prebuild
        env:
          LUME_ANDROID_KEYSTORE: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/lume-release.jks', runner.temp) || '' }}
        run: |
          set -euo pipefail
          npx expo prebuild -p android --no-install
          test -f android/gradlew || {
            echo "::error::prebuild did not produce android/gradlew"
            exit 1
          }
          if [ -n "${LUME_ANDROID_KEYSTORE}" ]; then
            grep -q 'signingConfig signingConfigs.release' android/app/build.gradle || {
              echo "::error::prebuild did not apply the release signing config"
              exit 1
            }
          fi

      # `assembleRelease`, not `assembleDebug`: expo-modules-core only declares
      # the release variant, so debug fails at configuration.
      #
      # The keystore is read from the environment by Gradle, injected by the
      # `with-release-signing` config plugin — `android/` is regenerated by
      # prebuild on every run, so there is nowhere to commit a signing config.
      # On a manual run with no keystore the plugin does nothing and the build
      # stays debug-signed: fine for testing the workflow, never published.
      - name: Build
        env:
          EXPO_PUBLIC_BUILD_COMMIT: ${{ github.sha }}
          LUME_ANDROID_KEYSTORE: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/lume-release.jks', runner.temp) || '' }}
          LUME_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUME_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUME_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew :app:assembleRelease --no-daemon

      - name: Name the artefact after what it is
        id: artefact
        run: |
          set -euo pipefail
          version=$(node -p "require('./app.json').expo.version")
          short=$(git rev-parse --short HEAD)
          src=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)

          # Ask the APK itself whether it is signed, rather than assuming the
          # earlier steps worked. A release that reaches the page unsigned is
          # one nobody can install, and that has already happened once.
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -r | head -n 1)
          if "$apksigner" verify --print-certs "$src" > /tmp/signer.txt 2>&1; then
            signed=yes
            grep -m1 'Signer #1 certificate SHA-256 digest' /tmp/signer.txt || true
          else
            signed=no
          fi

          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/v}" ] && [ "$signed" != yes ]; then
            echo "::error::the APK for a tagged release is not signed; Android would refuse it"
            cat /tmp/signer.txt
            exit 1
          fi

          suffix=""
          [ "$signed" = yes ] || suffix="-unsigned"
          name="lume-${version}-${short}${suffix}.apk"
          cp "$src" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          # The checksum is what makes an APK downloaded from a release page
          # verifiable against the one CI produced.
          sha256sum "$name" | tee "${name}.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk
          path: |
            ${{ steps.artefact.outputs.name }}
            ${{ steps.artefact.outputs.name }}.sha256

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true # a human decides when it goes public
          # Refuse silently-empty releases. v0.1.0 went out with no APK on it:
          # the tag had been deleted and re-created after a failed first build,
          # and the release that ended up published was not the one the
          # successful run had attached files to. Nothing failed — the workflow
          # reported success and the release page simply had nothing on it,
          # which for a release whose entire purpose is the APK is worse than a
          # red run.
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Android will warn that this app comes from outside the Play Store.
            That warning is about the distribution channel, not about the build.

            Verify what you downloaded against the checksum published beside it:

            ```
            sha256sum -c ${{ steps.artefact.outputs.name }}.sha256
            ```

            Built from `${{ github.sha }}`. The same commit is shown at the
            bottom of the app's first screen, so a device can be matched to a
            build without guessing.
          files: |
            ${{ steps.artefact.outputs.name }}
            ${{ steps.artefact.outputs.name }}.sha256
